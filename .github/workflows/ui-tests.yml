name: Run UI Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  MAESTRO_VERSION: 2.12.0
  MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e

jobs:
  RunUiTests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Install Maestro
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Run UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # On the 37.0 x86_64 image Android restarts itself when the map is reopened
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          # System UI is slow with software rendering, and its "isn't responding"
          # dialog would block every flow. A crashed app still fails its flow.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./scripts/run-ui-tests.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: build/ui-tests
          # Maestro keeps its screenshots and logs in a .maestro folder
          include-hidden-files: true
          retention-days: 14
